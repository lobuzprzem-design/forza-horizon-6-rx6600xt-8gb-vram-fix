name: Windows proxy checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all proxy DLLs and run regression tests
        shell: pwsh
        run: |
          .\build_proxy.ps1 -target all -RunTests
          # The script throws on real failures; a negative CLI test leaves LASTEXITCODE=1.
          exit 0

